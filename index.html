<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Movement Library</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f7f7f7;
      --ink: #111111;
      --muted: #666666;
      --line: #111111;
      --soft-line: #d0d0d0;
      --ink-25: #b8b8b8;
      --ink-12: #e6e6e6;
      --control: var(--bg);
      --control-hover: #f7f9ef;
      --control-line: #bfc5bb;
      --accent: #c8ff00;
      --accent-hover: #dfff32;
      --accent-soft: #f3ffd1;
      --accent-line: #8fc400;
      --accent-ink: #111111;
      --add: #7ec8ff;
      --add-hover: #9bd5ff;
      --add-soft: #edf8ff;
      --add-line: #2387c9;
      --score-composite: #c8ff00;
      --score-training: #8fb7ff;
      --score-metadata: #7b5cff;
      --role-primary-text: #111111;
      --role-secondary-text: #555555;
      --role-support-text: #777777;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(28px, 7vw, 44px); line-height: 1.15; }
    h2 { margin-bottom: 10px; color: var(--muted); font-size: 14px; }
    h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
    p, li { color: var(--ink); line-height: 1.45; }
    a { color: var(--ink); }

    button, input, select {
      appearance: none;
      font: inherit;
      border: 1px solid var(--control-line);
      border-radius: 0;
      background: var(--control);
      color: var(--ink);
      box-shadow: none;
    }

    button {
      min-height: 42px;
      margin: 0;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 650;
      line-height: 1.1;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    button:hover { border-color: #8f98a6; background: var(--control-hover); }
    button:active { background: var(--accent-soft); }
    button:disabled {
      border-color: var(--ink-12);
      background: var(--panel-2);
      color: var(--muted);
      cursor: default;
    }
    button:focus-visible,
    input:focus-visible,
    .movement-listing:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    input, select { width: 100%; min-height: 42px; padding: 8px 10px; }
    label { display: grid; gap: 6px; margin-bottom: 16px; color: var(--muted); }

    .movement-shell { width: 100%; max-width: 100%; min-width: 0; }
    .movement-screen[hidden],
    .evidence-modal[hidden],
    .quick-view-modal[hidden],
    .confirm-modal[hidden] { display: none; }
    .status-line:empty { display: none; }

    .movement-home-header,
    .collection-header,
    .workout-builder-header,
    .workout-block,
    .block-movement-row,
    .live-workout-header,
    .live-workout-block,
    .live-workout-row,
    .detail-hero,
    .detail-body,
    .movement-listing,
    .compare-tray,
    .compare-panel,
    .compare-column,
    .compare-row,
    .rating-box,
    .muscle-box,
    .movement-visual,
    .evidence-note,
    .evidence-section,
    .study-card,
    .role-evidence-card,
    .evidence-dialog,
    .empty-state {
      border: 1px solid var(--soft-line);
      background: var(--panel);
      box-shadow: none;
    }

    .movement-home-header,
    .collection-header,
    .workout-builder-header,
    .workout-block,
    .live-workout-header,
    .live-workout-block,
    .detail-hero,
    .detail-body,
    .compare-panel,
    .compare-column,
    .compare-row,
    .empty-state {
      padding: 16px;
    }

    .eyebrow,
    .section-label,
    .movement-count,
    .detail-kicker,
    .movement-summary-meta span,
    .tag,
    .community-rating,
    .rating-box strong,
    .role-key,
    .evidence-chip,
    .study-index {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }

    .section-label { margin: 20px 0 10px; }

    .featured-strip, .movement-list, .evidence-content, .role-evidence-grid, .muscle-role { display: grid; gap: 10px; }

    .screen-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .home-shell {
      display: grid;
      gap: 10px;
    }

    .home-panel,
    .calendar-panel,
    .day-panel,
    .workout-library-panel,
    .home-stat,
    .workout-card {
      border: 1px solid var(--soft-line);
      background: var(--panel);
    }

    .home-panel,
    .calendar-panel,
    .day-panel,
    .workout-library-panel {
      padding: 16px;
    }

    .home-actions,
    .calendar-toolbar,
    .day-panel-header,
    .workout-library-header,
    .workout-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .home-actions {
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .home-actions.single {
      justify-content: flex-start;
    }

    .home-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .home-stat {
      display: grid;
      gap: 2px;
      min-height: 64px;
      padding: 10px;
    }

    .home-stat strong {
      font-size: 24px;
      line-height: 1;
    }

    .calendar-toolbar {
      margin-bottom: 10px;
    }

    .calendar-toolbar h2 {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
    }

    .calendar-nav {
      display: flex;
      gap: 6px;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .mobile-week-calendar {
      display: none;
    }

    .calendar-weekdays {
      gap: 6px;
      margin-bottom: 6px;
    }

    .calendar-weekdays span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .calendar-grid {
      gap: 6px;
    }

    .calendar-day {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 78px;
      align-content: space-between;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
      text-align: left;
    }

    .calendar-day:hover {
      border-color: var(--line);
      background: var(--control-hover);
    }

    .calendar-day.outside-month {
      color: var(--ink-25);
      background: var(--panel-2);
    }

    .calendar-day.today {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }

    .calendar-day.has-workout { border-color: var(--line); }

    .calendar-day-number {
      color: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-day-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 14px;
    }

    .calendar-day-actions {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      pointer-events: none;
    }

    .calendar-add-button,
    .calendar-workout-button {
      --workout-color: var(--accent);
      pointer-events: auto;
      min-height: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--workout-color);
      color: var(--ink);
      overflow: hidden;
      transition: width 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .calendar-add-button {
      display: grid;
      width: 22px;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      font-size: 18px;
      line-height: 1;
    }

    .calendar-day:hover .calendar-add-button,
    .calendar-day:focus-within .calendar-add-button,
    .calendar-add-button:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .calendar-workout-button {
      display: flex;
      width: 12px;
      min-width: 12px;
      align-items: center;
      gap: 6px;
      justify-content: flex-start;
      opacity: 0.92;
    }

    .calendar-workout-button:hover,
    .calendar-workout-button:focus-visible {
      width: min(100%, 112px);
      padding: 0 6px;
      background: var(--workout-color);
      border-color: var(--line);
      color: var(--ink);
      opacity: 1;
      z-index: 2;
    }

    .calendar-workout-title {
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      font-weight: 700;
      transition: opacity 120ms ease;
    }

    .calendar-workout-button:hover .calendar-workout-title,
    .calendar-workout-button:focus-visible .calendar-workout-title { opacity: 1; }

    .mobile-week-block {
      display: grid;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--ink-12);
    }

    .mobile-week-block:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .mobile-week-block h3 {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .mobile-week-days {
      display: grid;
      gap: 6px;
    }

    .mobile-calendar-day {
      display: grid;
      align-content: space-between;
      gap: 5px;
      min-height: 58px;
      padding: 6px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
      cursor: pointer;
    }

    .mobile-calendar-day.today {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }

    .mobile-calendar-day.calendar-day-selected {
      border-color: var(--line);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .mobile-calendar-day.has-workout {
      border-color: var(--line);
    }

    .mobile-calendar-date {
      display: grid;
      gap: 1px;
      min-width: 0;
      text-align: left;
    }

    .mobile-calendar-date span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .mobile-calendar-date strong {
      font-size: 13px;
      line-height: 1.1;
    }

    .mobile-calendar-day .calendar-day-actions {
      position: static;
      display: flex;
      justify-content: flex-start;
      gap: 4px;
      min-height: 22px;
      pointer-events: auto;
    }

    .mobile-calendar-day .calendar-add-button {
      width: 20px;
      min-width: 20px;
      min-height: 20px;
      height: 20px;
      font-size: 15px;
    }

    .mobile-calendar-day.calendar-day-selected .calendar-add-button {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-calendar-day .calendar-workout-button {
      width: 14px;
      min-width: 14px;
      min-height: 20px;
      height: 20px;
    }

    .mobile-calendar-day .calendar-workout-button:hover,
    .mobile-calendar-day .calendar-workout-button:focus-visible {
      width: min(100%, 112px);
    }

    .day-panel {
      display: grid;
      gap: 10px;
    }

    .day-panel-header,
    .workout-library-header {
      align-items: start;
    }

    .workout-library-header {
      align-items: end;
    }

    .workout-library-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1;
      text-align: right;
    }

    .workout-list,
    .template-list,
    .schedule-picker {
      display: grid;
      gap: 8px;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .workout-template-tile {
      --workout-color: var(--accent);
      position: relative;
      display: grid;
      min-height: 0;
      aspect-ratio: 1;
      align-content: space-between;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
      color: var(--ink);
      text-align: left;
      overflow: hidden;
    }

    .workout-template-tile:hover,
    .workout-template-tile:focus-visible {
      border-color: var(--line);
      background: color-mix(in srgb, var(--workout-color) 8%, var(--panel));
    }

    .workout-template-tile.add {
      place-items: center;
      align-content: center;
      justify-items: center;
      text-align: center;
      border-color: var(--line);
    }

    .workout-template-plus {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 28px;
      line-height: 1;
    }

    .workout-template-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .workout-color-chip {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 1px solid var(--line);
      background: var(--workout-color);
    }

    .workout-template-tile h3 {
      margin: 0;
      font-size: clamp(17px, 4.8vw, 24px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .workout-template-tile .listing-summary {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .template-movement-count {
      display: inline-flex;
      width: fit-content;
      min-height: 24px;
      align-items: center;
      padding: 3px 6px;
      border: 1px solid var(--soft-line);
      background: color-mix(in srgb, var(--workout-color) 12%, var(--panel));
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .workout-muscle-map {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
    }

    .workout-muscle-map-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--soft-line);
    }

    .workout-map-visual {
      display: grid;
      gap: 8px;
    }

    .local-anatomy-viewer.workout-anatomy-viewer {
      min-height: 460px;
    }

    .workout-map-gradient {
      height: 8px;
      border: 1px solid var(--soft-line);
      background: linear-gradient(90deg, #dfe8e1, var(--workout-color));
    }

    .workout-color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .workout-color-swatch {
      --workout-color: var(--accent);
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border: 1px solid var(--soft-line);
      background: var(--workout-color);
    }

    .workout-color-swatch.active {
      border-color: var(--line);
      box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--line);
    }

    .workout-custom-color {
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      cursor: pointer;
    }

    .workout-custom-color::-webkit-color-swatch-wrapper { padding: 0; }
    .workout-custom-color::-webkit-color-swatch { border: 0; }
    .workout-custom-color::-moz-color-swatch { border: 0; }

    .workout-library-panel {
      display: grid;
      gap: 10px;
    }

    .schedule-picker {
      padding-top: 10px;
      border-top: 1px solid var(--ink-12);
    }

    .workout-card {
      align-items: start;
      padding: 10px;
    }

    .workout-card h3 {
      margin-bottom: 4px;
      font-size: 18px;
    }

    .workout-status {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 4px 7px;
      border: 1px solid var(--soft-line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .workout-status.completed {
      border-color: var(--accent-line);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .workout-status.draft,
    .workout-status.active {
      border-color: var(--line);
      color: var(--ink);
    }

    .workout-builder {
      display: grid;
      gap: 10px;
      padding-bottom: 92px;
    }

    .live-workout {
      display: grid;
      gap: 10px;
      padding-bottom: 92px;
    }

    .workout-builder-header {
      display: grid;
      gap: 12px;
    }

    .live-workout-header {
      display: grid;
      gap: 10px;
      border-color: var(--line);
      background: color-mix(in srgb, var(--workout-color, var(--accent)) 8%, var(--panel));
    }

    .live-workout-title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .live-workout-header h1 {
      margin-bottom: 0;
    }

    .live-progress {
      display: grid;
      gap: 7px;
    }

    .live-progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .live-progress-row strong {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .live-progress-track {
      height: 8px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
      overflow: hidden;
    }

    .live-progress-fill {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      background: var(--workout-color, var(--accent));
      transition: width 160ms ease;
    }

    .live-workout-list {
      display: grid;
      gap: 10px;
      touch-action: pan-y;
    }

    .live-workout-block {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .live-workout-block.is-complete {
      border-color: var(--accent-line);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }

    .live-block-header {
      display: grid;
      grid-template-columns: minmax(74px, 1fr) auto minmax(74px, 1fr);
      gap: 8px;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--soft-line);
    }

    .live-block-header button:first-child {
      justify-self: start;
    }

    .live-block-header button:last-child {
      justify-self: end;
    }

    .live-block-index {
      display: grid;
      gap: 2px;
      text-align: center;
    }

    .live-block-index strong {
      font-size: 18px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .live-block-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      min-width: 0;
    }

    .live-workout-row {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--ink-12);
      background: var(--panel);
    }

    .live-workout-row.is-complete {
      border-color: var(--accent-line);
      background: var(--accent-soft);
    }

    .live-row-header {
      display: grid;
      gap: 10px;
    }

    .live-movement-title-button {
      min-height: 0;
      padding: 0 0 4px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      font-weight: 850;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .live-movement-title-button:hover {
      background: transparent;
      border-color: var(--accent-line);
      color: var(--ink);
    }

    .live-target-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
    }

    .live-target-box {
      display: grid;
      min-height: 0;
      align-content: start;
      gap: 1px;
      padding: 5px 6px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }

    .live-target-box span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .live-target-box strong {
      color: var(--ink);
      font-size: 12px;
      line-height: 1.15;
    }

    .live-set-grid {
      display: grid;
      gap: 6px;
    }

    .live-set-tile {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
      min-height: 54px;
      padding: 6px;
      border: 1px solid var(--soft-line);
      background: var(--panel);
    }

    .live-set-tile.is-done {
      border-color: var(--accent-line);
      background: var(--accent-soft);

      padding: 10px;

      gap: 10px;
    }

    .compare-score-values {

      position: absolute;

      transform: translateY(-50%);

    .compare-score-marker.second {

    .compare-muscle {
      display: inline-flex;
      width: fit-content;
      padding: 5px 7px;
      border: 1px solid var(--soft-line);

    .compare-muscle.shared {

      background: var(--accent-soft);
      color: var(--accent-ink);

    .collection-header {

    .collection-title p {

      color: var(--muted);

    .collection-options,
    .movement-card-tags,

      display: flex;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      margin-bottom: 10px;
    }

    .collection-menu-button {

      gap: 1px 8px;
      min-height: 44px;
      text-align: left;
    }

    .collection-menu-button::after {
      content: "+";
      grid-column: 2;
      grid-row: 1 / 3;
      color: var(--muted);
      font-weight: 700;
    }

    .collection-menu-button.active::after {
      content: "-";
      color: var(--accent-ink);
    }

    .collection-menu-button span {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .collection-menu-button.active {
      border-color: var(--accent-line);
      background: var(--accent-soft);
    }

    .collection-dropdown-panel {
      display: grid;
      grid-column: 1 / -1;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--soft-line);
      background: var(--panel);

    .collection-picker {
      display: grid;
      gap: 8px;
    }

    .collection-rack {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    }

    .collection-rack .tag {
      justify-content: space-between;
      width: 100%;
      min-height: 44px;
    }

    .collection-rack .tag::after {
      content: "+";
      color: var(--muted);
      font-weight: 700;
    }

    .collection-rack .tag.active::after {
      content: "-";
      color: var(--accent-ink);

    .collection-rack .tag.has-selection:not(.active) {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--ink);

    .selected-tags {
      padding-top: 8px;

      gap: 6px;

      width: 100%;

      background: var(--control);
      color: var(--ink);
    }

    .collection-sort {
      display: grid;
      gap: 6px;

    .collection-sort-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .sort-button {
      min-height: 38px;
      padding: 7px 8px;
      background: var(--control);
      border-color: var(--control-line);
      color: var(--ink);
      font-size: 12px;

    .sort-button.active {

      color: var(--ink);

    .sort-subtype-menu {

      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      overflow: hidden;
    }

    .sort-subtype-grid {
      display: grid;
      grid-column: var(--sort-column, 2);
      gap: 6px;
      transform-origin: top;
      animation: subtype-open 170ms ease-out;

    .sort-subtype-button {
      min-height: 38px;
      padding: 7px 8px;
      border-color: var(--control-line);
      background: var(--control);
      color: var(--ink);
      font-size: 12px;
    }

    .sort-subtype-button.active {
      border-color: var(--group-color, var(--accent-line));
      background: color-mix(in srgb, var(--group-color, var(--accent)) 16%, var(--panel));
      color: var(--ink);
    }

    @keyframes subtype-open {
      from { max-height: 0; opacity: 0; transform: scaleY(0.96) translateY(-4px); }
      to { max-height: 340px; opacity: 1; transform: scaleY(1) translateY(0); }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--soft-line);
      border-radius: 0;

      color: var(--ink);

      background: var(--accent);
      color: var(--accent-ink);

    }

    .movement-listing:hover {

      background: #fbfcfe;

      text-align: left;

      display: -webkit-box;
      margin: 8px 0 0;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

    .movement-arrow {
      align-self: stretch;
      display: grid;
      place-items: center;
      min-width: 32px;
      color: var(--muted);
      font-size: 20px;
    }

    .detail-header-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .detail-title h1 {
      margin-bottom: 2px;
    }

    .detail-title .community-rating {
      margin: 0;
    }

    .detail-hero > .movement-card-tags {
      margin-top: 14px;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .detail-description,
    .listing-summary {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .movement-total {

      justify-self: start;
      gap: 2px;

      min-width: 0;
      min-height: 64px;
      padding: 6px 7px;
      border: 1px solid color-mix(in srgb, var(--score-color, var(--soft-line)) 46%, var(--soft-line));
      border-radius: 0;
      background: color-mix(in srgb, var(--score-color, var(--panel)) 14%, var(--panel));
      color: var(--ink);
      font-weight: 700;

    .movement-total span { color: var(--muted); font-size: 10px; }

      align-items: baseline;
      gap: 5px;

      text-overflow: ellipsis;
      white-space: nowrap;

    .movement-total.compact em {

      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      overflow-wrap: anywhere;

    .movement-score-stack {

      gap: 6px;
      align-content: start;
      min-width: 0;

    .movement-summary-meta span, .evidence-chip { border: 1px solid var(--soft-line); padding: 5px 6px; }

      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;

      text-align: left;

    .muscle-chip.active {

<body>
  <div class="app">
    <main id="movementsView" class="movement-shell" data-view="home">
      <div id="movementStatus" class="status-line">Loading movement library</div>
      <section id="movementHome" class="movement-screen movement-home" aria-live="polite"></section>
      <section id="movementWorkoutPage" class="movement-screen movement-workout-page" hidden aria-live="polite"></section>
      <section id="movementLivePage" class="movement-screen movement-live-page" hidden aria-live="polite"></section>
      <section id="movementCollection" class="movement-screen movement-collection" hidden aria-live="polite"></section>
      <section id="movementDetailPage" class="movement-screen movement-detail-page" hidden aria-live="polite"></section>
      <section id="movementComparePage" class="movement-screen movement-compare-page" hidden aria-live="polite"></section>
    </main>

  </div>

  <div id="evidenceModal" class="evidence-modal" hidden></div>
  <div id="movementQuickViewModal" class="quick-view-modal" hidden></div>
  <div id="confirmModal" class="confirm-modal" hidden></div>

  <script>
    const MOVEMENT_DATA_URL = "./data/movements.json";
    const WORKOUT_STORAGE_KEY = "workout_app.workouts.v1";
    const WORKOUT_TEMPLATE_STORAGE_KEY = "workout_app.workout_templates.v1";
    const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const MONTH_FORMATTER = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });
    const MONTH_DAY_FORMATTER = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
    const DAY_FORMATTER = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "short", day: "numeric", year: "numeric" });
    const ROLE_GROUPS = [
      { key: "primary", label: "Primary", className: "primary", viewerRole: "primary" },
      { key: "secondary", label: "Secondary", className: "secondary", viewerRole: "secondary" },
      { key: "support", label: "Support", className: "support", viewerRole: "support" }
    ];
    const WORKOUT_HEATMAP_ROLE_POINTS = { primary: 3, secondary: 2, support: 1 };
    const WORKOUT_HEATMAP_POINTS_PER_MOVEMENT = 6;
    const TRAINING_RATINGS = {
      hypertrophy: "Hypertrophy",
      strength: "Strength",
      joint_resilience: "Joint Resilience",
      athletic_transfer: "Athletic Transfer",
      control: "Motor Control",

    };
    const METADATA_RATINGS = {
      setup: "Setup",
      ease: "Ease",
      progression: "Progression",
      support: "Support"
    };
    const RATING_COLORS = {
      composite: "#c8ff00",
      training: "#8fb7ff",
      metadata: "#7b5cff",
      hypertrophy: "#8fb7ff",
      strength: "#8fb7ff",
      joint_resilience: "#8fb7ff",
      athletic_transfer: "#8fb7ff",
      control: "#8fb7ff",
      fatigue_efficiency: "#8fb7ff",
      setup: "#7b5cff",
      ease: "#7b5cff",
      progression: "#7b5cff",
      support: "#7b5cff"
    };
    const TAG_GROUP_LABELS = {
      region: "Muscle group",
      equipment: "Equipment",
      pattern: "Pattern",
      library: "Library"
    };
    const TAG_GROUP_ORDER = ["region", "equipment", "pattern"];
    const REGION_MACRO_ORDER = ["Upper body", "Core", "Lower body", "Misc"];
    const REGION_HIERARCHY = {
      "Upper body": ["Chest", "Back", "Shoulders"],
      "Core": ["Abs", "Obliques"],
      "Lower body": ["Quads", "Hamstrings", "Glutes", "Calves"],
      "Misc": []
    };
    const WRAP_HINTS = {
      quadriceps: "Quadri&shy;ceps",
      hamstrings: "Ham&shy;strings",
      gastrocnemius: "Gastro&shy;cnemius",
      semitendinosus: "Semi&shy;tendinosus",
      semimembranosus: "Semi&shy;membranosus",
      latissimus: "Latis&shy;simus",
      pectoralis: "Pector&shy;alis",
      stabilizers: "stabil&shy;izers"
    };
    const SORT_LABELS = {
      composite: "Composite",
      training: "Training",
      metadata: "Setup"
    };
    const SORT_DIRECTIONS = {
      none: "No sorting",
      desc: "High to low",
      asc: "Low to high"
    };
    const MAX_WORKOUTS_PER_DAY = 3;
    const WORKOUT_COLOR_OPTIONS = [
      { label: "Volt", value: "#c8ff00" },
      { label: "Blue", value: "#7ec8ff" },
      { label: "Purple", value: "#9b7cff" },
      { label: "Coral", value: "#ff7f6e" },
      { label: "Gold", value: "#ffd84d" },
      { label: "Slate", value: "#9aa3ad" }
    ];
    const DEFAULT_PROGRESSIONS = {
      compound: { label: "Compound", sets: 3, repMin: 8, repMax: 12, loadStep: 5, rirTarget: 2 },
      isolation: { label: "Isolation", sets: 3, repMin: 10, repMax: 15, loadStep: 5, rirTarget: 2 },
      bodyweight: { label: "Bodyweight", sets: 3, repMin: 8, repMax: 20, loadStep: 0, rirTarget: 2 }
    };
    const RIR_CYCLE = [null, 3, 2, 1, 0];

    const movementHome = document.getElementById("movementHome");
    const movementWorkoutPage = document.getElementById("movementWorkoutPage");
    const movementLivePage = document.getElementById("movementLivePage");
    const movementCollection = document.getElementById("movementCollection");
    const movementDetailPage = document.getElementById("movementDetailPage");
    const movementComparePage = document.getElementById("movementComparePage");
    const movementsView = document.getElementById("movementsView");
    const movementStatus = document.getElementById("movementStatus");
    const evidenceModal = document.getElementById("evidenceModal");
    const movementQuickViewModal = document.getElementById("movementQuickViewModal");
    const confirmModal = document.getElementById("confirmModal");

    let movementLibrary = [];
    let anatomyMuscles = [];
    let anatomyMeshBase = "./assets/bodyparts3d/";
    let movementView = "home";
    let activeCollectionGroup = null;
    let activeRegionMacro = null;
    let selectedCollectionTags = [];
    let collectionFiltersOpen = false;
    let collectionSortOpen = false;
    let collectionSortMetric = "composite";
    let collectionSortSubtype = null;
    let collectionSortDirection = "none";
    let collectionSortMenuOpen = false;
    let activeMovementId = null;
    let compareAnchorId = null;
    let compareTargetId = null;
    let compareOriginMovementId = null;
    let activeWorkoutId = null;
    let activeWorkoutTemplateId = null;
    let activeBlockId = null;
    let workoutBuilderReturnWorkoutId = null;
    let schedulePickerOpen = false;
    let initialEvidenceOpened = false;
    let workouts = loadStoredWorkouts();
    let workoutTemplates = loadStoredWorkoutTemplates();
    let selectedCalendarDate = todayKey();
    let activeMobileCalendarDate = null;
    let visibleCalendarMonth = monthStart(parseDateKey(selectedCalendarDate));
    let pendingConfirmAction = null;
    const selectedMuscles = {};

    publishAppData();
    initMovementLibrary();

    async function initMovementLibrary() {
      try {
        setMovementStatus("Loading movement library");
        const data = await loadMovementData();
        movementLibrary = Array.isArray(data.movements) ? data.movements : [];
        anatomyMuscles = Array.isArray(data.anatomy?.muscles) ? data.anatomy.muscles : [];
        anatomyMeshBase = data.anatomy?.meshBase || anatomyMeshBase;
        publishAppData();
        applyInitialMovementRoute();
        renderMovementApp({ replaceHistory: true });
        openInitialEvidenceFromUrl();
        setMovementStatus("");
      } catch (error) {
        console.error("Movement library failed to load", error);
        setMovementStatus("Movement library failed to load");
      }
    }

    async function loadMovementData() {
      const response = await fetch(MOVEMENT_DATA_URL);
      if (!response.ok) {
        throw new Error(`Movement data request failed with ${response.status}`);
      }
      return response.json();
    }

    function publishAppData() {
      window.workoutApp = {
        anatomyMeshBase,
        anatomyMuscles,
        movementLibrary,
        workouts,
        workoutTemplates,
        muscleRolesForMovement,
        muscleIdForName,
        workoutMuscleHeatmap,
        workoutRecordById,
        selectedMuscles
      };
    }

    function setMovementStatus(message) {
      movementStatus.textContent = message;
    }

    function renderMovementApp(options = {}) {
      movementsView.dataset.view = movementView;
      movementHome.hidden = movementView !== "home";
      movementWorkoutPage.hidden = movementView !== "workout";
      movementLivePage.hidden = movementView !== "live";
      movementCollection.hidden = movementView !== "collection";
      movementDetailPage.hidden = movementView !== "detail";
      movementComparePage.hidden = movementView !== "compare";

      if (movementView === "home") renderMovementHome();
      if (movementView === "workout") renderWorkoutBuilderPage();
      if (movementView === "live") renderLiveWorkoutPage();
      if (movementView === "collection") renderMovementCollection();
      if (movementView === "detail") renderMovementDetailPage();
      if (movementView === "compare") renderMovementComparePage();

      if (!options.skipHistory) updateMovementHistory({ replaceHistory: options.replaceHistory });
      if (movementView === "detail") {
        requestAnimationFrame(() => {
          window.renderLocalAnatomyViewers?.();
          setTimeout(() => window.renderLocalAnatomyViewers?.(), 260);
        });
      }
    }

    function renderMovementHome() {
      movementHome.innerHTML = `
        <div class="home-shell">
          <section class="home-panel">
            <p class="eyebrow">Home</p>
            <h1>Calendar</h1>
            <p>${escapeHTML(homeSummaryText())}</p>
            <div class="home-actions single">
              <button type="button" class="compare-button" onclick="openMovementCollection()">Movement Library</button>
            </div>
          </section>
          <section class="home-stats" aria-label="Workout summary">
            ${renderHomeStat("Last 30", `${completedWorkoutDaysInWindow(30)}/30`, "completed days")}
            ${renderHomeStat("Drafts", workoutCountByStatus(["draft", "active"]), "planned")}
            ${renderHomeStat("Templates", workoutTemplates.length, "workouts")}
          </section>
          <section class="calendar-panel" aria-label="Workout calendar">
            ${renderCalendarHeader()}
            <div class="month-calendar">
              <div class="calendar-weekdays" aria-hidden="true">
                ${WEEKDAY_LABELS.map(label => `<span>${escapeHTML(label)}</span>`).join("")}
              </div>
              <div class="calendar-grid">
                ${calendarDays(visibleCalendarMonth).map(renderCalendarDay).join("")}
              </div>
            </div>
            <div class="mobile-week-calendar">
              ${mobileCalendarWeeks().map(renderMobileCalendarWeek).join("")}
            </div>
          </section>
          ${renderScheduleModal()}

            </div>

    function renderHomeStat(label, value, caption) {
      return `

          <strong>${escapeHTML(value)}</strong>
          <span class="movement-count">${escapeHTML(caption)}</span>

    function homeSummaryText() {
      const completedDays = completedWorkoutDaysInWindow(30);
      if (!workouts.length && !workoutTemplates.length) return "No workouts planned yet.";
      if (completedDays) return `${completedDays} completed day${completedDays === 1 ? "" : "s"} in the last 30.`;

    function renderCalendarDay(date, options = {}) {
      const key = formatDateKey(date);
      const dayWorkouts = workoutsForDate(key);
      const status = calendarDateStatus(dayWorkouts);
      const isMobile = Boolean(options.mobile);
      const classes = [
        isMobile ? "mobile-calendar-day" : "calendar-day",
        !isMobile && !sameMonth(date, visibleCalendarMonth) ? "outside-month" : "",
        key === todayKey() ? "today" : "",
        isMobile && key === activeMobileCalendarDate ? "calendar-day-selected" : "",
        dayWorkouts.length ? "has-workout" : "",
        status
      ].filter(Boolean).join(" ");

      if (isMobile) {
        const showMobileAdd = key === activeMobileCalendarDate;
        return `
          <div
            class="${classes}"
            onclick="selectMobileCalendarDay('${escapeJS(key)}', event)"
            aria-label="${escapeHTML(calendarDayLabel(date, dayWorkouts))}"
          >
            <div class="mobile-calendar-date">
              <span>${escapeHTML(WEEKDAY_LABELS[date.getDay()])}</span>
              <strong>${escapeHTML(MONTH_DAY_FORMATTER.format(date))}</strong>
            </div>
            <div class="calendar-day-actions">
              ${renderCalendarWorkoutActions(dayWorkouts)}
              ${showMobileAdd && dayWorkouts.length < MAX_WORKOUTS_PER_DAY ? renderCalendarAddAction(key, dayWorkouts.length) : ""}
            </div>
          </div>
        `;
      }

      return `
        <div class="${classes}" aria-label="${escapeHTML(calendarDayLabel(date, dayWorkouts))}">
          <span class="calendar-day-number">${date.getDate()}</span>
          <div class="calendar-day-actions">
            ${renderCalendarWorkoutActions(dayWorkouts)}
            ${dayWorkouts.length < MAX_WORKOUTS_PER_DAY ? renderCalendarAddAction(key, dayWorkouts.length) : ""}
          </div>
        </div>

    function renderCalendarAddAction(dateKey, currentCount = 0) {
      return `
        <button
          type="button"
          class="calendar-add-button"
          onclick="openSchedulePicker('${escapeJS(dateKey)}', event)"
          aria-label="Add workout ${currentCount + 1} of ${MAX_WORKOUTS_PER_DAY} on ${escapeHTML(DAY_FORMATTER.format(parseDateKey(dateKey)))}"

      `;
    }

    function renderCalendarWorkoutActions(dayWorkouts) {
      return dayWorkouts.slice(0, MAX_WORKOUTS_PER_DAY).map(workout => `

          type="button"
          class="calendar-workout-button"
          style="${workoutColorStyle(workout)}"
          onclick="event.stopPropagation(); openLiveWorkout('${escapeJS(workout.id)}')"
          aria-label="Open ${escapeHTML(workoutTitle(workout))}"

    function renderScheduleModal() {
      if (!schedulePickerOpen) return "";
      if (!workoutTemplates.length) {

                  <h2>${escapeHTML(DAY_FORMATTER.format(parseDateKey(selectedCalendarDate)))}</h2>

                <button type="button" class="back-button" onclick="closeSchedulePicker()">Close</button>

                <h2>${escapeHTML(DAY_FORMATTER.format(parseDateKey(selectedCalendarDate)))}</h2>

              <button type="button" class="back-button" onclick="closeSchedulePicker()">Close</button>

    function renderWorkoutTemplateList() {
      return `
        <div class="template-grid">
          <button type="button" class="workout-template-tile add" onclick="createWorkoutTemplate()" aria-label="Add workout">
            <span class="workout-template-plus" aria-hidden="true">+</span>

    function renderWorkoutTemplateTile(template, { mode, dateKey }) {
      const movements = workoutMovements(template);

        <button

    function renderWorkoutCard(workout) {
      const movements = workoutMovements(workout);
      const status = formatWorkoutStatus(workout.status);
      return `
        <article class="workout-card">
          <div>
            <h3>${escapeHTML(workoutTitle(workout))}</h3>

              <div class="movement-card-tags">
                ${movements.slice(0, 6).map(movement => `<span class="tag tag-library">${escapeHTML(movement.name)}</span>`).join("")}

            ` : ""}
          </div>
        </article>

    function workoutTitle(workout) {
      if (workout.title) return workout.title;
      if (workout.name) return workout.name;
      if (workout.status === "completed") return "Completed Workout";
      return workout.status ? "Workout Draft" : "Untitled Workout";
    }

    function workoutSummary(workout, movements) {
      if (movements.length) return `${movements.length} movement${movements.length === 1 ? "" : "s"} selected.`;
      if (workout.status === "completed") return "Completed workout saved without movement details.";
      return "No movements selected.";
    }

    function workoutMuscleHeatmap(workout) {
      const totals = new Map();
      workoutMovements(workout).forEach(movement => {
        const roleBuckets = ROLE_GROUPS
          .map(group => ({
            muscles: movementMuscles(movement, group.key).filter(muscle => muscle.name),
            points: WORKOUT_HEATMAP_ROLE_POINTS[group.key] || 0
          }))
          .filter(bucket => bucket.muscles.length && bucket.points);
        const rolePointTotal = roleBuckets.reduce((sum, bucket) => sum + bucket.points, 0);
        if (!rolePointTotal) return;
        const scale = WORKOUT_HEATMAP_POINTS_PER_MOVEMENT / rolePointTotal;
        roleBuckets.forEach(bucket => {
          const pointsPerMuscle = (bucket.points * scale) / bucket.muscles.length;
          bucket.muscles.forEach(muscle => {
            const key = normalizeMuscleName(muscle.name);
            const existing = totals.get(key) || { name: muscle.name, score: 0 };
            existing.score += pointsPerMuscle;
            totals.set(key, existing);
          });
        });
      });
      return [...totals.values()]
        .map(item => ({ ...item, score: Math.round(item.score * 10) / 10 }))
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    }

    function renderWorkoutMuscleMap(workout) {
      const heatmap = workoutMuscleHeatmap(workout);
      if (!heatmap.length) return "";
      return `
        <section class="workout-muscle-map" style="${workoutColorStyle(workout)}" aria-label="Workout muscle map">
          <div class="workout-muscle-map-head">
            <p class="section-label">Muscle Map</p>
          </div>
          <div class="movement-visual workout-map-visual">
            <div
              class="local-anatomy-viewer workout-anatomy-viewer"
              data-workout-id="${escapeHTML(workout.id)}"
              aria-label="${escapeHTML(workoutTitle(workout))} workout muscle activation viewer"
            >
              <div class="anatomy-loading">Loading workout muscle map</div>
            </div>
            <span class="workout-map-gradient" aria-hidden="true"></span>
          </div>
        </section>
      `;
    }

    function renderWorkoutColorPicker(workout) {
